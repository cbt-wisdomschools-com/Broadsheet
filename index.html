<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Broadsheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee;
            color: #c0392b;
            border: 1px solid #fcc;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>

        <div id="message" class="message"></div>

        <div class="links">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCMS9yCW7gGln1X4rMq33RHoYeFWBLM0-E",
            authDomain: "broadsheet-492aa.firebaseapp.com",
            projectId: "broadsheet-492aa",
            storageBucket: "broadsheet-492aa.firebasestorage.app",
            messagingSenderId: "631605688845",
            appId: "1:631605688845:web:5ebfa528d7596f21033344",
            measurementId: "G-5DSG36J39H"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageDiv = document.getElementById('message');

        // Show message function
        function showMessage(text, type = 'error') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        // Login handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Validate
            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            messageDiv.className = 'message';

            try {
                // Query Firebase Realtime Database for user
                const dbRef = ref(database);
                const snapshot = await get(child(dbRef, 'users'));

                if (!snapshot.exists()) {
                    showMessage('No users found. Please register first.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }

                const users = snapshot.val();
                let foundUser = null;
                let userId = null;

                // Find user by email
                for (const [key, user] of Object.entries(users)) {
                    if (user.email === email) {
                        foundUser = user;
                        userId = key;
                        break;
                    }
                }

                if (!foundUser) {
                    showMessage('User not found. Please register first.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }

                // Check password
                if (foundUser.password === password) {
                    // Login successful
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    
                    // Store user session
                    sessionStorage.setItem('user', JSON.stringify({
                        id: userId,
                        email: foundUser.email,
                        name: foundUser.name || 'User'
                    }));

                    // Redirect to dashboard (you can change this)
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showMessage('❌ Invalid password. Please try again.', 'error');
                }

            } catch (error) {
                console.error('Login error:', error);
                showMessage('❌ An error occurred. Please try again.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
