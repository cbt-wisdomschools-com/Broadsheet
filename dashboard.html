<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Wisdom Foundation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #fdf6ee 0%, #f5ebe0 100%);
            position: relative;
        }

        /* Watermark background - 75% of page with opacity */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 75vh;
            background: url('img/logo.png') no-repeat center center;
            background-size: contain;
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            z-index: 1;
            border-top: 8px solid #8B6914;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===== SCHOOL LOGO - CENTERED ===== */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            height: 100px;
            width: 100px;
            border-radius: 20px;
            border: 4px solid #b87c44;
            padding: 8px;
            background: #fffbf0;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .logo-container img:hover {
            transform: scale(1.05);
        }

        .logo-container h1 {
            color: #5a3e1b;
            font-size: 28px;
            font-weight: 800;
            margin-top: 12px;
            letter-spacing: -0.5px;
        }

        .logo-container .school-name {
            color: #8B6914;
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
        }

        .logo-container .motto {
            color: #b8860b;
            font-size: 14px;
            font-weight: 600;
            background: #fdf6ee;
            display: inline-block;
            padding: 4px 24px;
            border-radius: 20px;
            margin-top: 6px;
            border: 1px solid #e8d5b5;
        }

        /* ===== AVATAR ===== */
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B6914, #b8860b);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto 16px;
            font-size: 40px;
            color: white;
            box-shadow: 0 8px 25px rgba(139, 105, 20, 0.3);
            border: 4px solid #fdf6ee;
        }

        /* ===== USER INFO ===== */
        .user-info {
            background: #fdf6ee;
            border-radius: 14px;
            padding: 20px 24px;
            margin: 20px 0;
            text-align: left;
            border: 2px solid #e8d5b5;
        }

        .user-info .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0e6d3;
        }

        .user-info .row:last-child {
            border-bottom: none;
        }

        .user-info .label {
            color: #888;
            font-weight: 500;
            font-size: 14px;
        }

        .user-info .value {
            color: #5a3e1b;
            font-weight: 700;
            font-size: 14px;
        }

        .user-info .value.email-value {
            color: #8B6914;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-group button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-group button:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B6914, #b8860b);
            color: white;
            box-shadow: 0 4px 16px rgba(139, 105, 20, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 28px rgba(139, 105, 20, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
            box-shadow: 0 4px 16px rgba(231, 76, 60, 0.3);
        }

        .btn-danger:hover {
            box-shadow: 0 8px 28px rgba(231, 76, 60, 0.4);
            background: #c0392b;
        }

        .btn-secondary {
            background: #f0e6d3;
            color: #5a3e1b;
        }

        .btn-secondary:hover {
            background: #e8d5b5;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                max-width: 95%;
            }

            .logo-container img {
                height: 75px;
                width: 75px;
            }

            .logo-container h1 {
                font-size: 22px;
            }

            .avatar {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group button {
                padding: 12px;
                font-size: 14px;
            }

            .user-info .row {
                flex-direction: column;
                padding: 8px 0;
                gap: 4px;
            }

            .user-info .value {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 14px;
            }

            .logo-container img {
                height: 60px;
                width: 60px;
            }

            .logo-container h1 {
                font-size: 18px;
            }

            .logo-container .school-name {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== SCHOOL LOGO - CENTERED ===== -->
        <div class="logo-container">
            <img src="img/logo.png" alt="Wisdom Foundation Logo" 
                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27 viewBox=%270 0 200 200%27%3E%3Crect width=%27200%27 height=%27200%27 fill=%27%23b87c44%27/%3E%3Ctext x=%2720%27 y=%27120%27 font-size=%2740%27 fill=%27white%27 font-weight=%27bold%27 font-family=%27Impact%27%3EWISDOM%3C/text%3E%3Ctext x=%2750%27 y=%27170%27 font-size=%2728%27 fill=%27%23f5d6b0%27 font-weight=%27bold%27 font-family=%27Impact%27%3EFOUNDATION%3C/text%3E%3C/svg%3E'">
            <h1>🏫 Wisdom Foundation</h1>
            <div class="school-name">WISDOM FOUNDATION SCHOOLS EGBEWA ADO EKITI</div>
            <div class="motto">🙏 GATEWAY TO THE UNIVERSITY</div>
        </div>

        <!-- ===== USER AVATAR ===== -->
        <div class="avatar">👤</div>

        <!-- ===== USER INFO ===== -->
        <div class="user-info">
            <div class="row">
                <span class="label">📧 Email</span>
                <span class="value email-value" id="userEmail">wisdom_admin@gmail.com</span>
            </div>
            <div class="row">
                <span class="label">👤 Role</span>
                <span class="value" id="userRole">Administrator</span>
            </div>
            <div class="row">
                <span class="label">🔐 Status</span>
                <span class="value"><span class="status-badge">✅ Authenticated</span></span>
            </div>
            <div class="row">
                <span class="label">⏰ Login Time</span>
                <span class="value" id="loginTime">Just now</span>
            </div>
        </div>

        <!-- ===== BUTTONS ===== -->
        <div class="btn-group">
            <button class="btn-primary" id="goToSheetBoardBtn">📋 Go to Sheet Board</button>
            <button class="btn-danger" id="logoutBtn">🚪 Logout</button>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const ADMIN_EMAIL = 'wisdom_admin@gmail.com';
        const AUTH_STORAGE_KEY = 'wisdom_auth_user';

        // ============================================================
        // CHECK AUTHENTICATION
        // ============================================================
        const storedUser = localStorage.getItem(AUTH_STORAGE_KEY);
        if (!storedUser) {
            window.location.href = 'login_firebase.html';
            return;
        }

        try {
            const user = JSON.parse(storedUser);
            if (user.email !== ADMIN_EMAIL) {
                localStorage.removeItem(AUTH_STORAGE_KEY);
                window.location.href = 'login_firebase.html';
                return;
            }

            // Display user info
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userRole').textContent = 'Administrator';

            if (user.loginTime) {
                const date = new Date(user.loginTime);
                document.getElementById('loginTime').textContent = date.toLocaleString();
            }
        } catch (e) {
            localStorage.removeItem(AUTH_STORAGE_KEY);
            window.location.href = 'login_firebase.html';
        }

        // ============================================================
        // GO TO SHEET BOARD
        // ============================================================
        document.getElementById('goToSheetBoardBtn').addEventListener('click', function() {
            window.location.href = 'sheet_board.html';
        });

        // ============================================================
        // LOGOUT
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('🚪 Are you sure you want to logout?')) {
                localStorage.removeItem(AUTH_STORAGE_KEY);
                window.location.href = 'login_firebase.html';
            }
        });

        // ============================================================
        // KEYBOARD SHORTCUT: Enter to go to sheet board
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.target.closest('button')) {
                document.getElementById('goToSheetBoardBtn').click();
            }
        });
    </script>
</body>
</html>
