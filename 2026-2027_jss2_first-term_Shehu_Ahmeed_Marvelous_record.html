<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Wisdom Foundation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .logo {
            margin-bottom: 20px;
        }
        .logo img {
            height: 80px;
            border-radius: 16px;
            border: 3px solid #b87c44;
            padding: 6px;
            background: #fffbf0;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .user-info {
            background: #f8f8f8;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .user-info .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .user-info .row:last-child {
            border-bottom: none;
        }
        .user-info .label {
            color: #888;
            font-weight: 500;
        }
        .user-info .value {
            color: #333;
            font-weight: 600;
            font-family: monospace;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-group button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-group button:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 25px rgba(231, 76, 60, 0.4);
        }
        .btn-success {
            background: #2ecc71;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 25px rgba(46, 204, 113, 0.4);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #e8f5e9;
            color: #2e7d32;
        }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .btn-group { flex-direction: column; }
            .user-info .row { flex-direction: column; padding: 6px 0; }
            .user-info .value { margin-top: 2px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="img/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2780%27%3E%3Crect width=%27200%27 height=%2780%27 fill=%27%23b87c44%27/%3E%3Ctext x=%2730%27 y=%2750%27 font-size=%2730%27 fill=%27white%27 font-weight=%27bold%27%3EWISDOM%3C/text%3E%3C/svg%3E'">
        </div>

        <div class="avatar">👤</div>

        <h1>Welcome, Admin!</h1>
        <p class="subtitle">You are logged in to the Wisdom Foundation Dashboard</p>

        <div class="user-info">
            <div class="row">
                <span class="label">📧 Email</span>
                <span class="value" id="userEmail">wisdom_admin@gmail.com</span>
            </div>
            <div class="row">
                <span class="label">👤 Role</span>
                <span class="value" id="userRole">Administrator</span>
            </div>
            <div class="row">
                <span class="label">🔐 Status</span>
                <span class="value"><span class="status-badge">✅ Authenticated</span></span>
            </div>
            <div class="row">
                <span class="label">⏰ Login Time</span>
                <span class="value" id="loginTime">Just now</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-primary" id="goToScoreSheetBtn">📊 Go to Score Sheet</button>
            <button class="btn-danger" id="logoutBtn">🚪 Logout</button>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = 'wisdom_admin@gmail.com';
        const AUTH_STORAGE_KEY = 'wisdom_auth_user';

        // Check authentication
        const storedUser = localStorage.getItem(AUTH_STORAGE_KEY);
        if (!storedUser) {
            window.location.href = 'login_firebase.html';
            return;
        }

        try {
            const user = JSON.parse(storedUser);
            if (user.email !== ADMIN_EMAIL) {
                localStorage.removeItem(AUTH_STORAGE_KEY);
                window.location.href = 'login_firebase.html';
                return;
            }
            
            // Display user info
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userRole').textContent = 'Administrator';
            if (user.loginTime) {
                const date = new Date(user.loginTime);
                document.getElementById('loginTime').textContent = date.toLocaleString();
            }
        } catch(e) {
            localStorage.removeItem(AUTH_STORAGE_KEY);
            window.location.href = 'login_firebase.html';
        }

        // Go to Score Sheet
        document.getElementById('goToScoreSheetBtn').addEventListener('click', function() {
            window.location.href = 'score_sheet.html';
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem(AUTH_STORAGE_KEY);
            window.location.href = 'login_firebase.html';
        });
    </script>
</body>
</html>
