<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Broadsheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        .user-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }

        .user-info p {
            margin: 8px 0;
            color: #555;
        }

        .user-info strong {
            color: #333;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-verified {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-unverified {
            background: #fff3e0;
            color: #e65100;
        }

        button {
            padding: 12px 40px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin: 5px;
        }

        button:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        button.secondary {
            background: #3498db;
        }

        button.secondary:hover {
            background: #2980b9;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee;
            color: #c0392b;
            border: 1px solid #fcc;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Welcome to Broadsheet</h1>
        <div id="userInfo" class="user-info">
            <p><strong>Name:</strong> <span id="userName">Loading...</span></p>
            <p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>
            <p><strong>Status:</strong> <span id="userVerified">Loading...</span></p>
            <p><strong>UID:</strong> <span id="userUid" style="font-size: 12px; color: #888;">Loading...</span></p>
        </div>
        
        <div class="button-group">
            <button id="logoutBtn">Logout</button>
            <button id="verifyBtn" class="secondary">Resend Verification</button>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { 
            getAuth, 
            sendEmailVerification,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMS9yCW7gGln1X4rMq33RHoYeFWBLM0-E",
            authDomain: "broadsheet-492aa.firebaseapp.com",
            projectId: "broadsheet-492aa",
            storageBucket: "broadsheet-492aa.firebasestorage.app",
            messagingSenderId: "631605688845",
            appId: "1:631605688845:web:5ebfa528d7596f21033344",
            measurementId: "G-5DSG36J39H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ==================== CHECK SESSION ====================
        const userData = sessionStorage.getItem('user');

        if (!userData) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(userData);
        document.getElementById('userName').textContent = user.name || 'User';
        document.getElementById('userEmail').textContent = user.email || 'No email';
        document.getElementById('userUid').textContent = user.uid || 'N/A';

        // ==================== EMAIL VERIFICATION STATUS ====================
        const verifiedSpan = document.getElementById('userVerified');
        if (user.emailVerified) {
            verifiedSpan.innerHTML = '<span class="badge badge-verified">✅ Verified</span>';
        } else {
            verifiedSpan.innerHTML = '<span class="badge badge-unverified">⚠️ Not Verified</span>';
        }

        const messageDiv = document.getElementById('message');

        function showMessage(text, type = 'error') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        // ==================== LOGOUT ====================
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                sessionStorage.removeItem('user');
                window.location.href = 'login.html';
            } catch (error) {
                showMessage(`Error logging out: ${error.message}`, 'error');
            }
        });

        // ==================== RESEND VERIFICATION ====================
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            try {
                const currentUser = auth.currentUser;
                if (!currentUser) {
                    showMessage('No user logged in', 'error');
                    return;
                }
                
                await sendEmailVerification(currentUser);
                showMessage('✅ Verification email sent! Check your inbox.', 'success');
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>
