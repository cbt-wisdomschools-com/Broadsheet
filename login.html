<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Wisdom Foundation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-image: url('img/computerlab1.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Dark overlay for better readability */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===== SCHOOL LOGO ===== */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container img {
            height: 80px;
            width: auto;
            border-radius: 16px;
            border: 3px solid #b87c44;
            padding: 6px;
            background: #fffbf0;
            object-fit: contain;
        }

        .logo-container h2 {
            color: #1f1c18;
            margin-top: 10px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-container .subtitle {
            color: #777;
            font-size: 14px;
            margin-top: 4px;
            font-weight: 400;
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #fafafa;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: white;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee;
            color: #c0392b;
            border: 1px solid #fcc;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .links {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #666;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .reset-password {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
        }

        .reset-password a {
            color: #888;
            text-decoration: none;
        }

        .reset-password a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        /* ===== DEBUG LOG ===== */
        .debug-container {
            margin-top: 20px;
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
        }

        .debug-toggle {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #555;
            width: auto;
            display: inline-block;
            transition: 0.2s;
        }

        .debug-toggle:hover {
            background: #e8e8e8;
        }

        .debug-log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: none;
            border: 2px solid #6c3483;
        }

        .debug-log.show {
            display: block;
        }

        .debug-log .timestamp {
            color: #858585;
        }
        .debug-log .info {
            color: #4fc3f7;
        }
        .debug-log .success {
            color: #81c784;
        }
        .debug-log .error {
            color: #ef5350;
        }
        .debug-log .warning {
            color: #ffd54f;
        }
        .debug-log .data {
            color: #ce93d8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 15px;
            }

            .logo-container img {
                height: 60px;
            }

            .logo-container h2 {
                font-size: 18px;
            }

            .login-btn {
                font-size: 15px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== SCHOOL LOGO ===== -->
        <div class="logo-container">
            <img src="img/logo.png" alt="Wisdom Foundation Logo" 
                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2780%27 viewBox=%270 0 200 80%27%3E%3Crect width=%27200%27 height=%2780%27 fill=%27%23b87c44%27/%3E%3Ctext x=%2720%27 y=%2750%27 font-size=%2730%27 fill=%27white%27 font-weight=%27bold%27 font-family=%27Impact%27%3EWISDOM%3C/text%3E%3Ctext x=%27110%27 y=%2750%27 font-size=%2722%27 fill=%27%23f5d6b0%27 font-weight=%27bold%27 font-family=%27Impact%27%3EFOUNDATION%3C/text%3E%3C/svg%3E'">
            <h2>🏫 Wisdom Foundation</h2>
            <p class="subtitle">Sign in to your account</p>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">📧 Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password">🔒 Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="login-btn" id="loginBtn">🔐 Login</button>
        </form>

        <div id="message" class="message"></div>

        <div class="reset-password">
            <a href="#" id="resetPasswordLink">Forgot password?</a>
        </div>

        <div class="links">
            Don't have an account? <a href="register_firebase.html">Register here</a>
        </div>

        <!-- ===== DEBUG ===== -->
        <!--<div class="debug-container">
            <button class="debug-toggle" id="debugToggle">🔍 Show Debug Log</button>
            <div class="debug-log" id="debugLog"></div>
        </div>-->
    </div>

    <script type="module">
        // ==================== FIREBASE IMPORTS ====================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // ==================== DEBUG LOGGER ====================
        const debugLog = document.getElementById('debugLog');
        const debugToggle = document.getElementById('debugToggle');

        function logDebug(message, type = 'info', data = null) {
            const timestamp = new Date().toISOString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> <span class="${type}">${message}</span>${data ? `\n<span class="data">📦 ${JSON.stringify(data, null, 2)}</span>` : ''}`;
            debugLog.appendChild(logEntry);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[DEBUG] ${message}`, data || '');
        }

        debugToggle.addEventListener('click', () => {
            debugLog.classList.toggle('show');
            debugToggle.textContent = debugLog.classList.contains('show') ? '🔒 Hide Debug Log' : '🔍 Show Debug Log';
        });

        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyCMS9yCW7gGln1X4rMq33RHoYeFWBLM0-E",
            authDomain: "broadsheet-492aa.firebaseapp.com",
            projectId: "broadsheet-492aa",
            storageBucket: "broadsheet-492aa.firebasestorage.app",
            messagingSenderId: "631605688845",
            appId: "1:631605688845:web:5ebfa528d7596f21033344",
            measurementId: "G-5DSG36J39H"
        };

        // ==================== INITIALIZE FIREBASE ====================
        logDebug('🚀 Initializing Firebase...', 'info');

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            logDebug('✅ Firebase initialized successfully!', 'success');
            window.auth = auth;
            window.db = db;
        } catch (error) {
            logDebug(`❌ Firebase initialization failed: ${error.message}`, 'error', error);
        }

        // ==================== DOM ELEMENTS ====================
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageDiv = document.getElementById('message');
        const resetPasswordLink = document.getElementById('resetPasswordLink');

        function showMessage(text, type = 'error') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            logDebug(`📢 Message: ${text} (${type})`, type);
        }

        // ==================== LOGIN HANDLER ====================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            logDebug('📝 Login attempt started', 'info');

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Logging in...';
            messageDiv.className = 'message';

            try {
                const auth = window.auth;
                const db = window.db;

                if (!auth || !db) {
                    throw new Error('Firebase not initialized');
                }

                // ==================== SIGN IN ====================
                logDebug(`🔐 Signing in with email: ${email}`, 'info');

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                logDebug(`✅ Login successful! UID: ${user.uid}`, 'success', { uid: user.uid, email: user.email });

                // ==================== GET USER DATA ====================
                logDebug('📚 Fetching user data from Firestore...', 'info');

                const userDoc = await getDoc(doc(db, 'users', user.uid));
                let userData = { name: 'User' };

                if (userDoc.exists()) {
                    userData = userDoc.data();
                    logDebug('✅ User data retrieved', 'success', userData);
                } else {
                    logDebug('⚠️ No user data found in Firestore', 'warning');
                }

                // ==================== STORE SESSION ====================
                const sessionData = {
                    uid: user.uid,
                    email: user.email,
                    name: userData.name || 'User',
                    emailVerified: user.emailVerified
                };

                sessionStorage.setItem('user', JSON.stringify(sessionData));
                logDebug('💾 Session stored', 'success', sessionData);

                // ==================== CHECK EMAIL VERIFICATION ====================
                if (!user.emailVerified) {
                    logDebug('⚠️ Email not verified', 'warning');
                    showMessage('⚠️ Please verify your email before continuing. Check your inbox.', 'error');
                }

                showMessage('✅ Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard_firebase.html';
                }, 1500);

            } catch (error) {
                logDebug(`❌ Login error: ${error.message}`, 'error', error);

                let errorMessage = 'An error occurred. Please try again.';

                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = '❌ No account found with this email. Please register.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = '❌ Incorrect password. Please try again.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '❌ Invalid email address.';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = '❌ Too many attempts. Please try again later.';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = '❌ This account has been disabled.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = '❌ Network error. Check your internet connection.';
                        break;
                    default:
                        errorMessage = `❌ ${error.message}`;
                }

                showMessage(errorMessage, 'error');

            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '🔐 Login';
                logDebug('🔓 Button re-enabled', 'info');
            }
        });

        // ==================== PASSWORD RESET ====================
        resetPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();

            if (!email) {
                showMessage('Please enter your email address first', 'error');
                return;
            }

            logDebug(`🔑 Requesting password reset for: ${email}`, 'info');

            try {
                const auth = window.auth;
                await sendPasswordResetEmail(auth, email);
                showMessage('✅ Password reset email sent! Check your inbox.', 'success');
                logDebug('✅ Password reset email sent', 'success');
            } catch (error) {
                logDebug(`❌ Password reset error: ${error.message}`, 'error', error);
                showMessage(`❌ ${error.message}`, 'error');
            }
        });

        // ==================== KEYBOARD SHORTCUT ====================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                debugToggle.click();
            }
        });

        logDebug('✅ Login page ready!', 'success');
        logDebug('💡 Press Ctrl+D to toggle debug log', 'info');
        logDebug('🔐 Use wisdom_admin@gmail.com / admin_123 for demo', 'info');
    </script>
</body>
</html>
