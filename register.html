<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Broadsheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee;
            color: #c0392b;
            border: 1px solid #fcc;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .message.info {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .password-requirements {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        /* Debug Log Styles */
        .debug-container {
            margin-top: 20px;
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
        }

        .debug-toggle {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #555;
            width: auto;
            display: inline-block;
        }

        .debug-toggle:hover {
            background: #e8e8e8;
            transform: none;
            box-shadow: none;
        }

        .debug-log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: none;
        }

        .debug-log.show {
            display: block;
        }

        .debug-log .timestamp {
            color: #858585;
        }

        .debug-log .info {
            color: #4fc3f7;
        }

        .debug-log .success {
            color: #81c784;
        }

        .debug-log .error {
            color: #ef5350;
        }

        .debug-log .warning {
            color: #ffd54f;
        }

        .debug-log .data {
            color: #ce93d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📝 Create Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required />
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
                <div class="password-requirements">Password must be at least 6 characters</div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
            </div>
            <button type="submit" id="registerBtn">Register</button>
        </form>

        <div id="message" class="message"></div>

        <div class="links">
            Already have an account? <a href="login.html">Login here</a>
        </div>

        <!-- Debug Section -->
        <div class="debug-container">
            <button class="debug-toggle" id="debugToggle">🔍 Show Debug Log</button>
            <div class="debug-log" id="debugLog"></div>
        </div>
    </div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        // ==================== DEBUG LOGGER ====================
        const debugLog = document.getElementById('debugLog');
        const debugToggle = document.getElementById('debugToggle');
        let debugEntries = [];

        function logDebug(message, type = 'info', data = null) {
            const timestamp = new Date().toISOString();
            const entry = { timestamp, message, type, data };
            debugEntries.push(entry);
            
            // Format for display
            const colorClass = type;
            const dataString = data ? `\n📦 Data: ${JSON.stringify(data, null, 2)}` : '';
            const logLine = `[${timestamp}] ${message}${dataString}`;
            
            // Add to log display
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> <span class="${colorClass}">${message}</span>${data ? `\n<span class="data">📦 ${JSON.stringify(data, null, 2)}</span>` : ''}`;
            debugLog.appendChild(logEntry);
            
            // Auto-scroll to bottom
            debugLog.scrollTop = debugLog.scrollHeight;
            
            // Also log to console
            console.log(`[DEBUG] ${logLine}`);
        }

        // Toggle debug log visibility
        debugToggle.addEventListener('click', () => {
            debugLog.classList.toggle('show');
            debugToggle.textContent = debugLog.classList.contains('show') ? '🔒 Hide Debug Log' : '🔍 Show Debug Log';
        });

        // ==================== FIREBASE SETUP ====================
        logDebug('🚀 Initializing Firebase...', 'info');

        const firebaseConfig = {
            apiKey: "AIzaSyCMS9yCW7gGln1X4rMq33RHoYeFWBLM0-E",
            authDomain: "broadsheet-492aa.firebaseapp.com",
            projectId: "broadsheet-492aa",
            storageBucket: "broadsheet-492aa.firebasestorage.app",
            messagingSenderId: "631605688845",
            appId: "1:631605688845:web:5ebfa528d7596f21033344",
            measurementId: "G-5DSG36J39H"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const database = getDatabase(app);
            logDebug('✅ Firebase initialized successfully!', 'success');
            logDebug(`📁 Project: ${firebaseConfig.projectId}`, 'info');
            
            // Test database connection
            logDebug('🔌 Testing database connection...', 'info');
            const testRef = ref(database);
            logDebug('✅ Database reference created', 'success');
            
            // Store database for later use
            window.db = database;
        } catch (error) {
            logDebug(`❌ Firebase initialization failed: ${error.message}`, 'error', error);
            showMessage('Failed to initialize Firebase. Check debug log.', 'error');
        }

        // ==================== DOM ELEMENTS ====================
        const registerForm = document.getElementById('registerForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const registerBtn = document.getElementById('registerBtn');
        const messageDiv = document.getElementById('message');

        logDebug('📋 DOM elements loaded', 'info');

        // ==================== MESSAGE FUNCTION ====================
        function showMessage(text, type = 'error') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            logDebug(`📢 Message shown: ${text} (${type})`, type);
        }

        // ==================== REGISTRATION HANDLER ====================
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            logDebug('📝 Form submission started', 'info');

            // Get form values
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            logDebug(`📊 Form data: Name="${name}", Email="${email}", Password length=${password.length}`, 'info');

            // ==================== VALIDATIONS ====================
            logDebug('🔍 Starting validations...', 'info');

            if (!name || !email || !password || !confirmPassword) {
                logDebug('❌ Validation failed: Empty fields detected', 'error', { name, email, password, confirmPassword });
                showMessage('Please fill in all fields', 'error');
                return;
            }
            logDebug('✅ All fields filled', 'success');

            if (password.length < 6) {
                logDebug('❌ Validation failed: Password too short', 'error', { length: password.length });
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            logDebug(`✅ Password length: ${password.length} characters`, 'success');

            if (password !== confirmPassword) {
                logDebug('❌ Validation failed: Passwords do not match', 'error', { password, confirmPassword });
                showMessage('Passwords do not match', 'error');
                return;
            }
            logDebug('✅ Passwords match', 'success');

            // ==================== DISABLE BUTTON ====================
            registerBtn.disabled = true;
            registerBtn.textContent = 'Registering...';
            messageDiv.className = 'message';
            logDebug('⏳ Button disabled, starting registration process...', 'info');

            try {
                // ==================== CHECK DATABASE CONNECTION ====================
                const db = window.db;
                if (!db) {
                    throw new Error('Database not initialized');
                }
                logDebug('📡 Database connection verified', 'success');

                // ==================== CHECK IF EMAIL EXISTS ====================
                logDebug(`🔍 Checking if email "${email}" already exists...`, 'info');
                const dbRef = ref(db);
                
                let snapshot;
                try {
                    snapshot = await get(child(dbRef, 'users'));
                    logDebug('✅ Database read successful', 'success');
                } catch (error) {
                    logDebug(`❌ Database read failed: ${error.message}`, 'error', error);
                    throw new Error(`Database read failed: ${error.message}`);
                }

                if (snapshot.exists()) {
                    const users = snapshot.val();
                    logDebug(`📊 Found ${Object.keys(users).length} existing users`, 'info');
                    
                    // Check for duplicate email
                    let duplicateFound = false;
                    for (const [key, user] of Object.entries(users)) {
                        logDebug(`🔍 Checking user: ${user.email}`, 'info');
                        if (user.email === email) {
                            duplicateFound = true;
                            logDebug(`⚠️ Duplicate email found: "${email}"`, 'warning', user);
                            break;
                        }
                    }

                    if (duplicateFound) {
                        showMessage('❌ Email already registered. Please login.', 'error');
                        registerBtn.disabled = false;
                        registerBtn.textContent = 'Register';
                        logDebug('❌ Registration stopped: Duplicate email', 'error');
                        return;
                    }
                    logDebug('✅ No duplicate email found', 'success');
                } else {
                    logDebug('📭 No existing users found. First user registration.', 'info');
                }

                // ==================== CREATE USER ====================
                const userId = Date.now().toString();
                logDebug(`🆕 Creating new user with ID: ${userId}`, 'info');

                const userData = {
                    id: userId,
                    name: name,
                    email: email,
                    password: password, // ⚠️ In production, hash this!
                    createdAt: new Date().toISOString()
                };
                logDebug('📦 User data prepared:', 'info', userData);

                // ==================== INSERT INTO FIREBASE ====================
                logDebug(`💾 Writing to database: /users/${userId}`, 'info');
                
                try {
                    await set(ref(db, `users/${userId}`), userData);
                    logDebug('✅ Data written successfully!', 'success');
                } catch (error) {
                    logDebug(`❌ Database write failed: ${error.message}`, 'error', error);
                    throw new Error(`Database write failed: ${error.message}`);
                }

                // ==================== VERIFY INSERT ====================
                logDebug('🔍 Verifying data was inserted...', 'info');
                try {
                    const verifySnapshot = await get(child(dbRef, `users/${userId}`));
                    if (verifySnapshot.exists()) {
                        logDebug('✅ Verification successful! Data exists in database.', 'success', verifySnapshot.val());
                    } else {
                        logDebug('⚠️ Warning: Data not found after insertion', 'warning');
                    }
                } catch (error) {
                    logDebug(`⚠️ Verification failed: ${error.message}`, 'warning', error);
                }

                // ==================== SUCCESS ====================
                showMessage('✅ Registration successful! Redirecting to login...', 'success');
                logDebug('🎉 Registration completed successfully!', 'success');

                // ==================== REDIRECT ====================
                setTimeout(() => {
                    logDebug('🔄 Redirecting to login.html...', 'info');
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                // ==================== ERROR HANDLING ====================
                logDebug(`❌ Registration error: ${error.message}`, 'error', error);
                logDebug(`📋 Error stack: ${error.stack}`, 'error');
                
                // Check for common errors
                if (error.message.includes('permission_denied')) {
                    showMessage('❌ Permission denied. Check Firebase rules.', 'error');
                    logDebug('🔑 Permission denied error - check your database rules', 'error');
                } else if (error.message.includes('network')) {
                    showMessage('❌ Network error. Check your internet connection.', 'error');
                    logDebug('🌐 Network error detected', 'error');
                } else {
                    showMessage(`❌ An error occurred: ${error.message}`, 'error');
                }

            } finally {
                // ==================== RE-ENABLE BUTTON ====================
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
                logDebug('🔓 Button re-enabled', 'info');
            }
        });

        // ==================== ADD KEYBOARD SHORTCUT FOR DEBUG ====================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                debugToggle.click();
                logDebug('⌨️ Debug toggled with Ctrl+D', 'info');
            }
        });

        logDebug('✅ Register page initialized and ready', 'success');
        logDebug('💡 Press Ctrl+D to toggle debug log', 'info');
    </script>
</body>
</html>
